# A tela nova em produção: arquivos estáticos do build do Vite e a API atrás do mesmo endereço.
server {
    listen 8088;
    root /usr/share/nginx/html;

    # Sem gzip, de propósito: a legada (Kestrel) também não comprime, e o benchmark compara a
    # arquitetura, não a compressão. Ligar gzip aqui é um ganho a mais, não medido.
    gzip off;

    # Problema 9: arquivo com hash no nome nunca muda de conteúdo: cache de um ano, sem revalidar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O que aponta para os nomes novos sempre revalida.
    location = /version.json { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Métricas são para o Prometheus, que coleta direto da API na rede interna; não ficam públicas.
    location = /api/metrics { return 404; }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
    }

    # Rotas da tela (React Router): qualquer outro caminho é o index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
