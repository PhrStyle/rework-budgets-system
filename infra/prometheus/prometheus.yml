# Coleta a API e o worker do ambiente "VPS" (compose.vps.yaml) a cada 5 s.
# No Docker rootless, um container não alcança processos rodando direto na máquina; por isso o
# Prometheus olha os serviços em container, que são o ambiente que simula produção.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:3000']
  - job_name: worker
    static_configs:
      - targets: ['worker:3001']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
