packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Baixam o schema engine do Prisma, usado por `prisma migrate`.
  '@prisma/engines': true
  prisma: true
  # Do Testcontainers: aceleradores nativos opcionais; funciona sem compilar.
  cpu-features: false
  protobufjs: false
  ssh2: false
