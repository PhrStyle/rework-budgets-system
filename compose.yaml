# Infra local: Postgres (2 bancos), Redis de cache, Redis de filas e Elasticsearch.
# Portas só em 127.0.0.1: acessíveis desta máquina, não da rede.
name: budgets

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      # Cria budgets_legacy e budgets_v2 na primeira inicialização.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 2s
      timeout: 3s
      retries: 30

  # Cache: só cópias reconstruíveis a partir do Postgres; pode perder tudo.
  # allkeys-lru: quando enche, apaga a chave usada há mais tempo. Sem persistência.
  redis-cache:
    image: redis:8.8.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '127.0.0.1:${REDIS_CACHE_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Dados que NÃO podem sumir: rascunhos de edição (trabalho não salvo do usuário) e filas (BullMQ).
  # Não se reconstroem a partir do Postgres, então:
  # noeviction: quando enche, recusa a escrita em vez de apagar. AOF com fsync a cada segundo.
  redis-data:
    image: redis:8.8.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - ''
    ports:
      - '127.0.0.1:${REDIS_DATA_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      # Só local. Em produção a segurança fica ligada.
      xpack.security.enabled: 'false'
      # Sem isso a JVM reserva uma fatia grande da RAM da máquina.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Limites de disco em espaço livre absoluto, não em %: num disco grande e quase cheio,
      # "90% usado" ainda pode ser dezenas de GB livres. Abaixo de 3 GB livres, para de alocar.
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    mem_limit: 1g
    ports:
      - '127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40

  # Rastreamento de erros (perfil opcional: pnpm obs:up). GlitchTip é um servidor de código aberto
  # compatível com o Sentry: a API e a tela usam o SDK oficial do Sentry, e em produção basta trocar o
  # DSN pelo do Sentry. Só para desenvolvimento local: DEBUG ligado e um usuário de teste criado
  # pelo próprio GlitchTip (bootstrap_dev). Usa o Postgres acima, num banco próprio, sem Redis
  # (por isso o `pnpm obs:up` cria antes a tabela de cache, que uma migração do GlitchTip usa).
  glitchtip:
    image: glitchtip/glitchtip:6.2
    profiles: [observabilidade]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      VALKEY_URL: ''
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-somente-desenvolvimento-local}
      GLITCHTIP_DOMAIN: http://127.0.0.1:${GLITCHTIP_PORT:-8000}
      SERVER_ROLE: all_in_one
      DEBUG: 'true'
      GLITCHTIP_BOOTSTRAP_DEV: 'true'
      ENABLE_USER_REGISTRATION: 'false'
    ports:
      - '127.0.0.1:${GLITCHTIP_PORT:-8000}:8000'
    mem_limit: 768m

  # Métricas (perfil "observabilidade"): o Prometheus coleta a API e o worker do ambiente "VPS"
  # (compose.vps.yaml) e avalia as regras de alerta; o Grafana mostra o painel pronto.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observabilidade]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observabilidade]
    depends_on: [prometheus]
    environment:
      # Só local: entra direto como visitante, sem login, e não há como editar.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orcamentos.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    mem_limit: 256m

volumes:
  prometheus-data:
  postgres-data:
  redis-data:
  elasticsearch-data:
