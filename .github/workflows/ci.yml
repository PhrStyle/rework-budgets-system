name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa a versão fixada no campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Falha se package.json e pnpm-lock.yaml não baterem, em vez de atualizar o lockfile.
      - run: pnpm install --frozen-lockfile
      # O client do Prisma é gerado a partir do schema e não vai para o git.
      - run: pnpm --filter @budgets/api generate
      - run: pnpm lint
      - run: pnpm typecheck
      # Os testes da API sobem um Postgres descartável (Testcontainers) no Docker do runner.
      - run: pnpm test:coverage

  legacy:
    name: Legada (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O teste de integração carrega os dados do gerador (TypeScript): o contrato entre as versões.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:generate -- --profile small

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: legacy/global.json
      - run: dotnet format legacy/Budgets.Legacy.sln --verify-no-changes
      # Testcontainers sobe um Postgres descartável no Docker do runner.
      - run: dotnet test legacy/Budgets.Legacy.sln

  secrets:
    name: Detecção de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: procura segredos em todos os commits do PR
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
