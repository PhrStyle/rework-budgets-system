name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa a versão fixada no campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Falha se package.json e pnpm-lock.yaml não baterem, em vez de atualizar o lockfile.
      - run: pnpm install --frozen-lockfile
      # O client do Prisma é gerado a partir do schema e não vai para o git.
      - run: pnpm --filter @budgets/api generate
      - run: pnpm lint
      - run: pnpm typecheck
      # A tela precisa gerar o build de produção (Vite), não só passar nos tipos.
      - run: pnpm --filter @budgets/web build
      # Os testes da API sobem um Postgres descartável (Testcontainers) no Docker do runner.
      - run: pnpm test:coverage

  legacy:
    name: Legada (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O teste de integração carrega os dados do gerador (TypeScript): o contrato entre as versões.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:generate -- --profile small

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: legacy/global.json
      - run: dotnet format legacy/Budgets.Legacy.sln --verify-no-changes
      # Testcontainers sobe um Postgres descartável no Docker do runner.
      - run: dotnet test legacy/Budgets.Legacy.sln

  e2e:
    name: Tela no navegador (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @budgets/api generate

      # Postgres e os dois Redis do próprio compose, com os valores de exemplo do .env.
      # Sem Elasticsearch: a busca cai para o Postgres, o que estes testes não usam.
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis-cache redis-data
      - run: pnpm seed:generate -- --profile small
      - run: pnpm v2:seed small

      - run: pnpm --filter @budgets/web exec playwright install --with-deps chromium
      - run: pnpm v2:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  secrets:
    name: Detecção de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: procura segredos em todos os commits do PR
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
